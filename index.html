<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="header-top">

            <div class="lens"></div>

            <h1>POKÉDEX</h1>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>


        <div class="controls">

            <!-- Barre de recherche -->

            <input
                type="text"
                id="search"
                placeholder="Rechercher un Pokémon..."
                autocomplete="off"
            >


            <!-- Filtre par type -->

            <select id="type-filter">

                <option value="all">
                    Tous les types
                </option>

            </select>


            <!-- Compteur favoris -->

            <div class="fav-counter">

                ⭐ Favoris :
                <strong id="favorites-count">0</strong>

            </div>

        </div>

    </header>


    <!-- ================= CONTENU ================= -->

    <main>

        <!-- Message de chargement / erreur / recherche vide -->

        <div
            id="status-message"
            class="hidden"
        ></div>


        <!-- ================= POKÉMON ================= -->

        <section class="pokemon-section">

            <div
                id="pokemon-list"
                class="grid"
            ></div>

        </section>


        <!-- ================= FAVORIS ================= -->

        <section
            id="favorites"
            class="favorites-section"
        >

            <div class="section-title">

                <h2>Mes favoris</h2>

                <span>
                    <strong id="favorites-count-bottom">0</strong>
                    Pokémon
                </span>

            </div>


            <!-- Cartes des favoris -->

            <div
                id="favorites-list"
                class="grid"
            ></div>


            <!-- Aucun favori -->

            <div
                id="no-favorites"
                class="no-favorites hidden"
            >

                <div class="empty-icon">☆</div>

                <h3>Aucun favori</h3>

                <p>
                    Ajoutez des Pokémon à vos favoris
                    pour les retrouver ici.
                </p>

            </div>

        </section>

    </main>


    <!-- ================= MODALE ================= -->

    <div
        id="overlay"
        class="overlay hidden"
    >

        <div class="modal">

            <div class="modal-screen">

                <button
                    id="close-modal"
                    class="close-btn"
                    type="button"
                    aria-label="Fermer"
                >
                    ✕
                </button>


                <!-- Les détails seront ajoutés par app.js -->

                <div id="modal-content"></div>

            </div>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        Données fournies par la
        <strong>PokéAPI</strong> 

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="js/Pokemon.js"></script>
    <script src="js/app.js"></script>
    <script src="js/favoris.js"></script>

</body>

</html>
