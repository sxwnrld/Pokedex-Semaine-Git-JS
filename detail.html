<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="detail.css">
    <title>Detail-Carte</title>
</head>
<body>
    <h1>Détails de la carte</h1>
    <div class="details-carte"> 
        <h2>Salamèche</h2> 
        <div class="données-pokemon">
            <img src="salameche.png" alt="Salamèche">
            <table>
                <tr>
                    <th> Type: </th>
                    <td>Feu</td>    
                </tr>
                <tr>
                    <th> PV: </th>
                    <td>60</td>
                </tr>
                <tr>
                    <th> Taille: </th>
                    <td>160</td>
                </tr>
                <tr>
                    <th> Poids: </th>
                    <td>90</td>
                </tr>
                <tr>
                    <th> Attaque: </th>
                    <td>52</td>
                </tr>
                <tr>
                    <th> Défense: </th>
                    <td>43</td>
                </tr>
            </table>
            <button class="favorite-btn" data-id="${pokemon.id}" type="button" aria-label="Ajouter aux favoris">Ajoutez au favoris</button>
        </div>
    </div>
</body>
</html>
